 <div class="card"><h3>🔍 Detailed Scores <span class="sub mut">· tap a metric to see its scoring criteria</span></h3><div style="overflow-x:auto"><table><tr><th>Sub-metric</th><th>${pLab(pp)}</th><th>${pLab(p)}</th><th>Change</th></tr>${kv.map(([k])=>`<tr class="kh"><td colspan="4">${k.name}</td></tr>`+B.subs.filter(s=>s.kpi==k.id&&(ps(em,p,s.id)!=null||ps(em,pp,s.id)!=null)).map(s=>{const a=ps(em,pp,s.id),b=ps(em,p,s.id),cell=v=>v==null?'<span style="color:#C5CEE0">–</span>':`<div class="c" style="background:${lab(v)[1]}">${f(v)}</div>`;return`<tr onclick="tg('cr-${s.id}')" style="cursor:pointer"><td>${s.name} ${s.crit?'<span class="mut">ⓘ</span>':''}</td><td>${cell(a)}</td><td>${cell(b)}</td><td>${a!=null&&b!=null?dArrow(b-a):''}</td></tr>${s.crit?`<tr id="cr-${s.id}" style="display:none"><td colspan="4"><div class="crit">${s.crit}</div></td></tr>`:''}`}).join('')).join('')}</table></div></div>`}

let A,at='emp';
const esc=x=>String(x).replace(/"/g,'&quot;');
function mod(t,body,fn,lbl){document.getElementById('modal').innerHTML=`<div class="modal"><div class="mb"><h3 style="margin:0 0 8px">${t}</h3>${body}<div class="bar" style="margin-top:14px;justify-content:flex-end"><button class="btn g" onclick="document.getElementById('modal').innerHTML=''">Cancel</button><button class="btn" id="sv" ${lbl=='Delete'?'style="background:#DC2626"':''} onclick="${fn}">${lbl||'Save'}</button></div></div></div>`}
function rpc(fn,a){const b=document.getElementById('sv');if(b)b.textContent='Saving…';google.script.run.withSuccessHandler(()=>{document.getElementById('modal').innerHTML='';A=null;load()}).withFailureHandler(e=>{alert(e.message);if(b)b.textContent='Save'})[fn](...a)}
const v$=id=>document.getElementById(id).value;
function adm(){if(!A){document.getElementById('main').innerHTML='<div class="msg">Loading…</div>';google.script.run.withSuccessHandler(a=>{A=a;adm()}).adminData();return}
 const tb='';
 const nm=e=>(A.emps.find(x=>x.email==e)||{name:e}).name,m=document.getElementById('main');
 if(at=='emp')m.innerHTML=tb+`<div class="card"><div class="bar" style="margin-bottom:10px"><button class="btn" onclick="fEmp()">+ Add employee</button></div><div style="overflow-x:auto"><table><tr><th>Name</th><th>Email</th><th>Department</th><th>Joined</th><th>Scored by</th><th>Status</th><th></th></tr>${A.emps.map(e=>`<tr><td><b>${e.name}</b></td><td>${e.email}</td><td>${e.dept||'—'}</td><td>${e.join?ml(e.join):'—'}</td><td>${e.scorers.map(nm).join(', ')||'—'}</td><td><span class="pill" style="background:${e.status=='Active'?'#16A34A':'#9AA7C2'}">${e.status}</span></td><td><button class="btn g" onclick="fEmp('${e.id}')">Edit</button></td></tr>`).join('')}</table></div></div>`;
 if(at=='acc')m.innerHTML=tb+`<div class="card"><div class="bar" style="margin-bottom:10px"><button class="btn" onclick="fAcc()">+ Add / change scorer access</button></div><div class="sub" style="color:#6B7A99;margin-bottom:8px">Department access lets a scorer view and score everyone in that department, in addition to their direct team.</div><table><tr><th>Scorer</th><th>Department access</th><th></th></tr>${A.acc.map(a=>`<tr><td><b>${a.name}</b></td><td>${a.depts.join(', ')||'Direct team only'}</td><td><button class="btn g" onclick="fAcc('${a.email}')">Edit</button></td></tr>`).join('')}</table></div>`;
 if(at=='kpi')m.innerHTML=tb+kbody();if(at=='bk')m.innerHTML=tb+bkHtml()}
function fEmp(id){const e=A.emps.find(x=>x.id==id)||{name:'',email:'',dept:'',scorers:[],status:'Active',role:'Staff',scored:true},ds=[...new Set(A.emps.map(x=>x.dept).filter(Boolean))].sort();
 mod(id?'Edit employee':'Add employee',`Name<br><input id=en value="${esc(e.name)}" style="width:100%"><br><br>Rankviz email<br><input id=ee value="${e.email}" style="width:100%"><br><br>Department (pick or type a new one)<br><input id=ed list=dl value="${esc(e.dept)}" style="width:100%"><datalist id=dl>${ds.map(d=>`<option value="${esc(d)}">`).join('')}</datalist><br><br>Joining month <select id=ej><option value="">Not set (shows in all months)</option>${monthsPlus().map(m=>`<option value="${m}" ${m==(e.join||(id?'':SM()))?'selected':''}>${ml(m)}</option>`).join('')}</select><br><br>Scored by (Ctrl/Cmd+click for more than one)<br><select id=es multiple size=7 style="width:100%">${A.emps.filter(x=>x.status=='Active'&&x.email!=e.email).map(x=>`<option value="${x.email}" ${e.scorers.includes(x.email)?'selected':''}>${x.name}</option>`).join('')}</select><br><br>Status <select id=et><option ${e.status=='Active'?'selected':''}>Active</option><option ${e.status!='Active'?'selected':''}>Left</option></select><br><br>Role <select id=er><option value=Staff ${e.role=='Staff'?'selected':''}>Staff</option><option value=CEO ${e.role=='CEO'?'selected':''}>CEO (sees whole company)</option><option value=HR ${e.role=='HR'?'selected':''}>HR / Admin</option></select><br><br><label><input type=checkbox id=ec ${e.scored!==false?'checked':''}> Performance is scored (appears in team lists)</label>`,`rpc('saveEmployee',[{id:'${id||''}',name:v$('en'),email:v$('ee'),dept:v$('ed'),scorers:[...document.getElementById('es').selectedOptions].map(o=>o.value),status:v$('et'),join:v$('ej'),role:v$('er'),scored:document.getElementById('ec').checked}])`)}
function fAcc(em){const ds=[...new Set(A.emps.filter(x=>x.scored&&x.dept).map(x=>x.dept))].sort(),a=A.acc.find(x=>x.email==em)||{depts:[]};
 mod('Department access',`Scorer<br><select id=ap style="width:100%" ${em?'disabled':''}>${A.emps.filter(x=>x.status=='Active'&&x.scored).map(x=>`<option value="${x.email}" ${x.email==em?'selected':''}>${x.name}</option>`).join('')}</select><br><br>${ds.map(d=>`<label style="display:block;padding:3px 0"><input type=checkbox class=ak value="${esc(d)}" ${a.depts.includes(d)?'checked':''}> ${d}</label>`).join('')}`,`rpc('saveAccess',[v$('ap'),[...document.querySelectorAll('.ak:checked')].map(c=>c.value)])`)}
function leftList(){const L=B.list.filter(e=>e.scored&&!e.active),hr=B.role=='HR';
 const R=L.map(e=>{const ms=months.filter(m=>ov(e.email,m)!=null);return{e,n:ms.length,all:av(ms.map(m=>ov(e.email,m))),last:ms[ms.length-1]}});
 document.getElementById('main').innerHTML=`<div class="card"><h3>🗂 Former employees <span class="sub mut">· ${L.length} · history is kept; they are not counted in team averages</span></h3>${L.length?`<div style="overflow-x:auto"><table><tr><th>Name</th><th>Department</th><th>Overall (all months)</th><th>Last scored</th><th></th></tr>${R.map(r=>`<tr><td><b>${r.e.name}</b></td><td>${r.e.dept.replace(' Department','')||'—'}</td><td>${r.all==null?'–':`<span class="pill" style="background:${lab(r.all)[1]}">${f(r.all)}</span> <span class="sub mut">${r.n} mo</span>`}</td><td>${r.last?ml(r.last):'–'}</td><td style="text-align:right;white-space:nowrap"><button class="btn g" onclick="viewLeft('${r.e.email}')">View history</button> ${hr?`<button class="btn" style="background:#DC2626" onclick="fDel('${r.e.email}')">Delete permanently</button>`:''}</td></tr>`).join('')}</table></div>`:'<div class="mut">No former employees yet. When HR marks someone as Left (Admin > Employees > Edit), they appear here with all their scores.</div>'}</div>`}
function viewLeft(em){const ms=months.filter(m=>ov(em,m)!=null);if(ms.length){P={t:'m',v:ms[ms.length-1]};fillPV()}sel=em;render()}
function fDel(em){const e=B.list.find(x=>x.email==em);mod('Delete permanently?',`<p>This will <b>permanently delete ${e.name}</b> and <b>all their scores</b> for every month. <b>This cannot be undone.</b></p><p class="sub mut" style="opacity:1">If you only want them out of the team, keep them here — they are already excluded from team averages.</p>Type <b>DELETE</b> to confirm:<br><input id=cf style="width:100%">`,"if(v$('cf')!=='DELETE'){alert('Please type DELETE to confirm.');return}rpc('deleteEmployee',['"+em+"'])",'Delete')}

function sbBlock(){const n=document.querySelectorAll('.sbk').length+1;document.getElementById('sbs').insertAdjacentHTML('beforeend',`<div class="sbk" style="border:1px solid #E3E9F5;border-radius:12px;padding:10px;margin-top:10px"><b>Sub-metric ${n}</b><br><input class="sn" placeholder="Name (e.g. Task Deadline)" style="width:100%;margin-top:6px"><div style="margin:8px 0">Weight %: <input class="sw" type="number" value="10" style="width:80px"></div><textarea class="sc" rows="4" placeholder="Scoring criteria — what earns 5, 4, 3, 2, 1 (leave blank for the standard scale)" style="width:100%"></textarea></div>`)}
const subsOf=()=>[...document.querySelectorAll('.sbk')].map(b=>({name:b.querySelector('.sn').value,w:b.querySelector('.sw').value,criteria:b.querySelector('.sc').value}));
const monthsPlus=()=>{const[y,mo]=months[months.length-1].split('-').map(Number),d=new Date(y,mo,1);return months.concat(d.getFullYear()+'-'+pad(d.getMonth()+1))};
const monthSel=(id,def)=>`<select id="${id}">${monthsPlus().map(m=>`<option value="${m}" ${m==def?'selected':''}>${ml(m)}</option>`).join('')}</select>`;
function fKpi(){const tot=B.subs.filter(s=>s.active).reduce((a,s)=>a+s.w,0);mod('Add new KPI (applies to everyone)',`Name<br><input id=kn style="width:100%"><br><br>Description (optional)<br><textarea id=kd rows=2 style="width:100%"></textarea><br><br>Starts from: ${monthSel('sm',SM())} <span class="sub mut" style="opacity:1">(earlier months will not include it)</span><div class="sub mut" style="opacity:1;margin-top:10px">Current total weight of all active sub-metrics: <b>${tot}%</b>. After adding, adjust weights so the total is 100%.</div><div id="sbs"></div><button class="btn g" style="margin-top:10px" onclick="sbBlock()">+ Add another sub-metric</button>`,"rpc('kpiAdd',[v$('kn'),v$('kd'),subsOf(),v$('sm')])");sbBlock()}
function fSub(id){mod('Add sub-metric',`Name<br><input id=sn style="width:100%"><br><br>Weight %: <input id=sw type=number value=10 style="width:80px"><br><br>Starts from: ${monthSel('sm',SM())}<br><br>Scoring criteria (what earns 5, 4, 3, 2, 1) — leave blank for the standard scale<br><textarea id=sc rows=6 style="width:100%"></textarea>`,`rpc('subAdd',['${id}',v$('sn'),v$('sw'),v$('sc'),v$('sm')])`)}
function fEnd(kind,id,name){mod('Remove '+name+'?',`<p>It will no longer be part of scoring <b>from the month you choose onwards</b>. Earlier months keep it, with all their scores.</p>Remove from: ${monthSel('em',SM())}`,`rpc('setActive',['${kind}','${id}',false,v$('em')])`,'Remove')}
const kAct=k=>B.subs.some(x=>x.kpi==k.id&&x.active);
function kbody(){const hr=B.role=='HR',vis=B.kpis.filter(k=>hr||k.scope=='ALL'||k.mine);
 return `<div class="card kintro"><div><h3>KPIs &amp; sub-metrics</h3><p class="sub mut">KPIs you add apply to everyone, from the month you pick. Removing never deletes — earlier months keep their KPIs and scores.</p></div><button class="btn" onclick="fKpi()">+ Add KPI</button></div>`+
 vis.map(k=>{const can=hr||k.mine,ss=B.subs.filter(s=>s.kpi==k.id),tot=ss.filter(s=>s.active).reduce((a,s)=>a+s.w,0),ka=kAct(k),sc=k.scope=='ALL'?'Company KPI':'Team KPI · '+k.owner+' · '+(k.applies||[]).length+' employees';
 return`<div class="card"><div class="khead"><div><div class="kt"><h3>${k.name}</h3><span class="pill" style="background:${ka?'#16A34A':'#9AA7C2'}">${ka?'Active':'Removed'}</span></div><div class="kmeta"><span class="chip">${sc}</span><span class="chip">KPI weight ${tot}%</span></div></div>${can?`<span><button class="btn g" onclick="fSub('${k.id}')">+ Sub-metric</button> ${ka?`<button class="btn g dg" onclick="fEnd('kpi','${k.id}','${esc(k.name)}')">Remove KPI</button>`:`<button class="btn g" onclick="rpc('setActive',['kpi','${k.id}',true,''])">Bring back</button>`}</span>`:''}</div>${k.desc?`<div class="sub mut" style="opacity:1">${k.desc}</div>`:''}${ss.map(s=>`<div class="srow"><div style="flex:1"><b class="sn">${s.name}</b><span class="sub mut">${s.start?'From '+ml(s.start):''}${s.end?' · removed after '+ml(s.end):''}</span>${s.crit?`<details><summary>Scoring criteria</summary><div class="crit">${s.crit}</div></details>`:''}</div>${can?`<span class="wctl"><span class="wl">Weight</span><span class="wi"><input type="number" value="${s.w}" onchange="rpc('subWeight',['${s.id}',this.value])">%</span> ${s.active?`<button class="btn g dg" onclick="fEnd('sub','${s.id}','${esc(s.name)}')">Remove</button>`:`<button class="btn g" onclick="rpc('setActive',['sub','${s.id}',true,''])">Restore</button>`}</span>`:`<span class="sub mut">${s.w}%</span>`}</div>`).join('')}</div>`}).join('')}

function bkHtml(){return '<div class="card"><h3>⬇ Download backup</h3><p class="sub mut" style="opacity:1">Saves all employees, access, KPIs, sub-metrics and scores in one file (.json). Keep it private — it contains staff data.</p><button class="btn" id="dl" onclick="bkDown()">Download backup</button></div><div class="card"><h3>⬆ Restore from backup</h3><p class="sub mut" style="opacity:1">This <b>replaces everything</b> in the database with the file\'s contents. A safety copy of the current data is kept in the database first.</p><input type="file" id="bf" accept=".json"><br><br>Type <b>RESTORE</b> to confirm: <input id="bc"> <button class="btn" style="background:#DC2626" id="rb" onclick="bkUp()">Restore</button></div>'}
function bkDown(){const b=document.getElementById('dl');b.disabled=true;b.textContent='Preparing…';google.script.run.withSuccessHandler(t=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download='kpi-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();b.disabled=false;b.textContent='Download backup'}).withFailureHandler(e=>{alert(e.message);b.disabled=false;b.textContent='Download backup'}).exportBackup()}
function bkUp(){const f=document.getElementById('bf').files[0];if(!f)return alert('Choose a backup file first.');if(v$('bc')!=='RESTORE')return alert('Type RESTORE to confirm.');const b=document.getElementById('rb');b.disabled=true;b.textContent='Restoring…';const r=new FileReader();r.onload=()=>google.script.run.withSuccessHandler(m=>{alert(m);A=null;load()}).withFailureHandler(e=>{alert(e.message);b.disabled=false;b.textContent='Restore'}).restoreBackup(r.result);r.readAsText(f)}

load();
</script><script>
(()=>{const m=document.getElementById('main'),fix=()=>{m.querySelectorAll('h3').forEach(h=>{if(h.dataset.f)return;h.dataset.f=1;const n=h.firstChild;if(n&&n.nodeType==3)n.textContent=n.textContent.replace(/^[^\p{L}\p{N}]+/u,'')});
m.querySelectorAll('td:first-child>b').forEach(b=>{if(b.dataset.f)return;b.dataset.f=1;const i=b.textContent.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();b.insertAdjacentHTML('afterbegin','<span class="ia">'+i+'</span>')})};
const tint=()=>{m.querySelectorAll('.pill,.cat').forEach(e=>{if(e.dataset.t)return;const c=e.style.backgroundColor||e.style.background;if(!c)return;e.dataset.t=1;e.style.setProperty('--c',c);e.style.background='';e.style.backgroundColor=''})},all=()=>{fix();tint()};new MutationObserver(all).observe(m,{childList:true,subtree:true});all()})();
</script></body></html>
